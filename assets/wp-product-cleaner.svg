<svg width="1200" height="310" viewBox="0 0 1200 310" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070707"/><stop offset="1" stop-color="#141414"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="1" y="1" width="1198" height="308" rx="24" fill="url(#bg)" stroke="#fff" stroke-opacity=".12"/>
<rect x="34" y="32" width="142" height="32" rx="16" fill="#fff"/>
<text x="105" y="53" text-anchor="middle" fill="#000" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="900" letter-spacing="2">PLUGIN #001</text>
<text x="34" y="111" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="900">TZYRED Product Cleaner</text>
<text x="34" y="145" fill="#aaa" font-family="Inter,Arial,sans-serif" font-size="16">Exact product + image search, visual review and controlled WooCommerce catalog cleanup.</text>

<g font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800">
  <rect x="34" y="176" width="104" height="34" rx="17" fill="#101010" stroke="#fff" stroke-opacity=".16"/><text x="86" y="198" text-anchor="middle" fill="#fff">v2.0.0</text>
  <rect x="150" y="176" width="154" height="34" rx="17" fill="#101010" stroke="#fff" stroke-opacity=".16"/><text x="227" y="198" text-anchor="middle" fill="#fff">WordPress 6.2+</text>
  <rect x="316" y="176" width="120" height="34" rx="17" fill="#101010" stroke="#fff" stroke-opacity=".16"/><text x="376" y="198" text-anchor="middle" fill="#fff">PHP 7.4+</text>
  <rect x="448" y="176" width="148" height="34" rx="17" fill="#101010" stroke="#fff" stroke-opacity=".16"/><text x="522" y="198" text-anchor="middle" fill="#fff">WooCommerce</text>
</g>

<g transform="translate(755 42)">
  <rect width="405" height="220" rx="20" fill="#090909" stroke="#fff" stroke-opacity=".10"/>
  <text x="25" y="34" fill="#777" font-family="monospace" font-size="12">CLEANUP PIPELINE</text>
  <g font-family="monospace" font-size="15">
    <text x="25" y="76" fill="#fff">01  exact product search</text>
    <text x="25" y="110" fill="#fff" opacity="0">02  exact image matching<animate attributeName="opacity" values="0;1;1;1;1" dur="5s" repeatCount="indefinite"/></text>
    <text x="25" y="144" fill="#fff" opacity="0">03  visual review + CSV<animate attributeName="opacity" values="0;0;1;1;1" dur="5s" repeatCount="indefinite"/></text>
    <text x="25" y="178" fill="#fff" opacity="0">04  guarded batch cleanup<animate attributeName="opacity" values="0;0;0;1;1" dur="5s" repeatCount="indefinite"/></text>
  </g>
  <rect x="25" y="198" width="340" height="5" rx="2.5" fill="#fff" opacity=".08"/>
  <rect x="25" y="198" width="80" height="5" rx="2.5" fill="#fff" filter="url(#glow)">
    <animate attributeName="width" values="40;340;40" dur="5s" repeatCount="indefinite"/>
  </rect>
</g>

<text x="34" y="254" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">Highlights:</text>
<text x="112" y="254" fill="#999" font-family="Inter,Arial,sans-serif" font-size="15">saved searches • pause/resume • safe Trash flow • permanent-delete confirmation • workspace branding</text>

<circle cx="702" cy="48" r="4" fill="#fff"><animate attributeName="opacity" values=".15;1;.15" dur="1.2s" repeatCount="indefinite"/></circle>
<text x="34" y="286" fill="#777" font-family="monospace" font-size="12">STATUS: BUILT • PACKAGED • READY FOR STAGING TESTS</text>
</svg>