<svg width="1200" height="230" viewBox="0 0 1200 230" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#050505"/><stop offset=".5" stop-color="#121212"/><stop offset="1" stop-color="#050505"/></linearGradient>
  <radialGradient id="g"><stop stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="230" rx="26" fill="url(#bg)"/>
<rect width="1200" height="230" rx="26" fill="url(#grid)">
  <animateTransform attributeName="transform" type="translate" values="0 0;36 36" dur="8s" repeatCount="indefinite"/>
</rect>
<ellipse cx="182" cy="115" rx="145" ry="115" fill="url(#g)"/>
<g transform="translate(182 115)">
  <circle r="64" fill="#0e0e0e" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
  <circle r="50" fill="none" stroke="#fff" stroke-opacity=".12" stroke-dasharray="5 10">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
  </circle>
  <text x="0" y="12" text-anchor="middle" fill="#fff" font-size="42" font-family="Georgia,serif" font-weight="700">WP</text>
  <circle cx="0" cy="-72" r="4" fill="#fff" filter="url(#glow)"><animate attributeName="opacity" values=".2;1;.2" dur="1.6s" repeatCount="indefinite"/></circle>
</g>

<text x="330" y="76" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="900" letter-spacing="4">WORDPRESS PLUGIN LAB</text>
<text x="332" y="112" fill="#aaa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" letter-spacing="2">BUILDING • TESTING • SHIPPING • IMPROVING</text>
<text x="332" y="149" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">A growing collection of practical WordPress &amp; WooCommerce tools by TZYRED AI.</text>
<text x="332" y="183" fill="#8e8e8e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">One plugin at a time. Real problems → clean tools → reusable systems.</text>

<g transform="translate(1000 48)">
  <rect width="145" height="132" rx="22" fill="#0d0d0d" stroke="#fff" stroke-opacity=".14"/>
  <text x="72.5" y="34" text-anchor="middle" fill="#888" font-family="monospace" font-size="12" letter-spacing="2">PLUGIN COUNT</text>
  <text x="72.5" y="91" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="900">001</text>
  <text x="72.5" y="116" text-anchor="middle" fill="#fff" opacity=".65" font-family="monospace" font-size="11">LAB ONLINE</text>
  <animate attributeName="opacity" values=".82;1;.82" dur="2.4s" repeatCount="indefinite"/>
</g>

<rect x="330" y="207" width="610" height="2" rx="1" fill="#fff" opacity=".1"/>
<rect x="330" y="207" width="120" height="2" rx="1" fill="#fff" filter="url(#glow)">
  <animate attributeName="x" values="330;820;330" dur="4.2s" repeatCount="indefinite"/>
  <animate attributeName="width" values="90;180;90" dur="4.2s" repeatCount="indefinite"/>
</rect>
</svg>