<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
    <stop stop-color="#030303"/><stop offset=".5" stop-color="#111111"/><stop offset="1" stop-color="#030303"/>
  </linearGradient>
  <radialGradient id="halo"><stop stop-color="#FFFFFF" stop-opacity=".18"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  <linearGradient id="beam" x1="0" x2="1"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".065"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="360" rx="30" fill="url(#bg)"/>
<g>
  <rect x="-48" y="-48" width="1296" height="456" fill="url(#grid)">
    <animateTransform attributeName="transform" type="translate" values="0 0;48 48" dur="8s" repeatCount="indefinite"/>
  </rect>
</g>
<ellipse cx="600" cy="170" rx="430" ry="210" fill="url(#halo)">
  <animate attributeName="rx" values="380;460;380" dur="5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".45;.85;.45" dur="5s" repeatCount="indefinite"/>
</ellipse>
<rect x="0" y="-20" width="1200" height="70" fill="url(#beam)" opacity=".10">
  <animate attributeName="y" values="-70;380" dur="5.8s" repeatCount="indefinite"/>
</rect>

<g opacity=".9">
  <circle cx="146" cy="86" r="5" fill="#fff"><animate attributeName="opacity" values=".15;1;.15" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="1035" cy="92" r="3" fill="#fff"><animate attributeName="r" values="2;7;2" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="1100" cy="258" r="4" fill="#fff"><animate attributeName="cy" values="270;238;270" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="98" cy="268" r="3" fill="#fff"><animate attributeName="cx" values="80;130;80" dur="4.7s" repeatCount="indefinite"/></circle>
</g>

<text x="600" y="128" text-anchor="middle" fill="#fff" font-size="70" font-weight="900" letter-spacing="9" font-family="Inter,Segoe UI,Arial,sans-serif">TZYRED AI
  <animate attributeName="opacity" values=".82;1;.82" dur="2.8s" repeatCount="indefinite"/>
</text>
<text x="600" y="177" text-anchor="middle" fill="#B8B8B8" font-size="20" font-weight="600" letter-spacing="2" font-family="Inter,Segoe UI,Arial,sans-serif">WEB APPS  •  SEO  •  DIGITAL MARKETING  •  CMS  •  SOFTWARE DEV</text>
<text x="600" y="218" text-anchor="middle" fill="#fff" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif">Building smart brands, clean systems &amp; digital growth. 🖤</text>

<g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="3" text-anchor="middle">
  <text x="600" y="266" fill="#fff" opacity="0">BUILD<animate attributeName="opacity" values="1;1;0;0;0;0;0;0" dur="8s" repeatCount="indefinite"/></text>
  <text x="600" y="266" fill="#fff" opacity="0">OPTIMIZE<animate attributeName="opacity" values="0;0;1;1;0;0;0;0" dur="8s" repeatCount="indefinite"/></text>
  <text x="600" y="266" fill="#fff" opacity="0">RANK<animate attributeName="opacity" values="0;0;0;0;1;1;0;0" dur="8s" repeatCount="indefinite"/></text>
  <text x="600" y="266" fill="#fff" opacity="0">SCALE<animate attributeName="opacity" values="0;0;0;0;0;0;1;1" dur="8s" repeatCount="indefinite"/></text>
</g>

<rect x="250" y="309" width="700" height="2" rx="1" fill="#fff" opacity=".12"/>
<rect x="250" y="309" width="170" height="2" rx="1" fill="url(#beam)" filter="url(#glow)">
  <animate attributeName="x" values="210;820;210" dur="4.5s" repeatCount="indefinite"/>
  <animate attributeName="width" values="120;260;120" dur="4.5s" repeatCount="indefinite"/>
</rect>
</svg>