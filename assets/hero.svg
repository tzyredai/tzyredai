<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050505"/>
      <stop offset="0.5" stop-color="#111111"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <g opacity="0.12">
    <path d="M0 64H1200M0 128H1200M0 192H1200M0 256H1200" stroke="#FFFFFF"/>
    <path d="M120 0V320M240 0V320M360 0V320M480 0V320M600 0V320M720 0V320M840 0V320M960 0V320M1080 0V320" stroke="#FFFFFF"/>
  </g>

  <circle cx="126" cy="84" r="7" fill="#FFFFFF" opacity="0.75">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1084" cy="238" r="5" fill="#FFFFFF" opacity="0.45">
    <animate attributeName="r" values="4;8;4" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <text x="600" y="130" text-anchor="middle" fill="#FFFFFF" font-size="62" font-weight="800" letter-spacing="5" font-family="Inter,Segoe UI,Arial,sans-serif">TZYRED AI</text>
  <text x="600" y="180" text-anchor="middle" fill="#BDBDBD" font-size="22" font-weight="500" letter-spacing="1.8" font-family="Inter,Segoe UI,Arial,sans-serif">WEB APPS  •  SEO  •  DIGITAL MARKETING  •  CMS  •  SOFTWARE DEV</text>
  <text x="600" y="225" text-anchor="middle" fill="#FFFFFF" opacity="0.82" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif">Building smart brands, clean systems &amp; digital growth. 🖤</text>

  <rect x="280" y="268" width="640" height="2" rx="1" fill="url(#line)" filter="url(#glow)">
    <animate attributeName="x" values="180;380;180" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="width" values="420;640;420" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
